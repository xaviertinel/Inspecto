<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspecto · Visites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   INSPECTO · Design tokens (BearingPoint Design System)
   ========================================================================= */
:root{
  --bp-red:#ff3d47;--bp-red-hover:#e42630;--bp-red-press:#c81922;--bp-deep-red:#330000;
  --bp-red-50:#ffe9ea;--bp-red-100:#ffd0d3;
  --n0:#fff;--n50:#f6f2ef;--n100:#e6deda;--n200:#ccc1bc;--n300:#b3a69f;--n400:#948880;--n500:#6f645e;--n600:#524a45;--n700:#3a3330;--n800:#24201d;--n900:#121010;
  --purple:#6a2c91;
  --font-sans:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.2,0,0,1);
  --shadow-sm:0 1px 2px rgba(18,16,16,.06);--shadow-md:0 2px 8px rgba(18,16,16,.08);--shadow-lg:0 8px 28px rgba(18,16,16,.12);
  --shadow-focus:0 0 0 3px rgba(255,61,71,.35);

  /* semantic (jour) */
  --bg:#fff;--surface:#fff;--surface-2:var(--n50);--surface-3:var(--n100);
  --side-bg:var(--n50);--side-border:var(--n100);
  --text:#000;--text-2:var(--n600);--text-3:var(--n500);
  --border:var(--n200);--border-soft:var(--n100);
  --sev-crit:var(--bp-red);--sev-maj:var(--n800);--sev-min:var(--n400);--sev-pos:var(--purple);
}
:root[data-theme="night"]{
  --bg:#000;--surface:#121010;--surface-2:#1b1816;--surface-3:#24201d;
  --side-bg:#0a0909;--side-border:#24201d;
  --text:#fff;--text-2:rgba(255,255,255,.72);--text-3:rgba(255,255,255,.55);
  --border:#3a3330;--border-soft:#24201d;
  --sev-maj:#e6deda;--sev-min:#948880;--sev-pos:#a97fc9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="day"]):not([data-theme="night"]){
    --bg:#000;--surface:#121010;--surface-2:#1b1816;--surface-3:#24201d;--side-bg:#0a0909;--side-border:#24201d;
    --text:#fff;--text-2:rgba(255,255,255,.72);--text-3:rgba(255,255,255,.55);--border:#3a3330;--border-soft:#24201d;
    --sev-maj:#e6deda;--sev-min:#948880;--sev-pos:#a97fc9;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
img{max-width:100%}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.rule{width:48px;height:3px;background:var(--bp-red);margin:10px 0 0}
.mono{font-family:var(--font-mono)}
.h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 0}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.h3{font-size:16px;font-weight:700;margin:0}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:4px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;transition:background .15s var(--ease),transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-color:var(--text)}
.btn-red{background:var(--bp-red);border-color:var(--bp-red);color:#fff}.btn-red:hover{background:var(--bp-red-hover)}
.btn-dark{background:var(--text);border-color:var(--text);color:var(--bg)}.btn-dark:hover{opacity:.88;background:var(--text)}
.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:4px;box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:500;white-space:nowrap}
.tag-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.input{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--text);color:var(--bg)}
.grid{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--border-soft);margin:16px 0}
.sev{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sev i{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:8px;background:var(--surface-3);border-radius:0;position:relative}
.bar>b{position:absolute;inset:0 auto 0 0;background:var(--text)}
.bar>b.red{background:var(--bp-red)}
.bar>em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bp-red)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;z-index:100;box-shadow:var(--shadow-lg);animation:fadeUp .2s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--bp-red);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:4px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);padding:24px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:65;overflow:auto;box-shadow:var(--shadow-lg);animation:slideIn .22s var(--ease);padding-top:env(safe-area-inset-top,0px)}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
.empty{padding:40px;text-align:center;color:var(--text-3)}

/* ---------- shell ---------- */
.shell{display:flex;height:100%}
.side{width:248px;flex:none;background:var(--side-bg);border-right:1px solid var(--side-border);display:flex;flex-direction:column;transition:width .22s var(--ease);position:relative}
.side.collapsed{width:72px}
.side-head{padding:22px 20px 18px;border-bottom:1px solid var(--side-border);min-height:108px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--font-mono);font-weight:600;letter-spacing:.18em;font-size:14px}
.brand-mark::before{content:"";width:3px;height:18px;background:var(--bp-red)}
.side-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:4px;border:0;background:transparent;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;position:relative;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--bp-red)}
.nav-item svg{flex:none}
.nav-item .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
.nav-sec{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px;white-space:nowrap;overflow:hidden}
.side.collapsed .lbl,.side.collapsed .cnt,.side.collapsed .nav-sec,.side.collapsed .foot-txt{display:none}
.side-foot{border-top:1px solid var(--side-border);padding:14px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.collapse-btn{position:absolute;right:-13px;bottom:74px;width:26px;height:26px;border-radius:50%;background:var(--bp-red);color:#fff;border:0;display:grid;place-items:center;z-index:5;box-shadow:var(--shadow-md)}
.main{flex:1;min-width:0;overflow:auto;position:relative}
.page{padding:32px;max-width:1280px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.net{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.net i{width:7px;height:7px;border-radius:50%;background:#2e9d5b}
.net.off i{background:var(--bp-red)}
@media (max-width:900px){.page{padding:20px 16px}}

/* ---------- visit app ---------- */
.visit{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.v-top{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border-soft)}
.v-body{flex:1;min-height:0;display:flex}
.v-center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:20px 16px}
.v-aside{width:360px;flex:none;border-left:1px solid var(--border-soft);overflow:auto;background:var(--surface-2)}
@media (max-width:700px){.v-aside{display:none}.v-aside.show-mobile{display:block;position:fixed;inset:0;z-index:40;width:100%}}
.orb-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center;margin:18px 0 10px}
.orb{width:150px;height:150px;border-radius:50%;border:0;background:var(--bp-red);color:#fff;display:grid;place-items:center;transition:transform .08s linear;box-shadow:0 0 0 0 rgba(255,61,71,.3)}
.orb.idle{background:var(--text);color:var(--bg)}
.orb.paused{background:var(--bp-deep-red)}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--bp-red);opacity:.35}
.edge-glow{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,61,71,0);transition:box-shadow .1s linear;z-index:30}
.v-tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.v-tool{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--border-soft);background:var(--surface);border-radius:4px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--text-2);position:relative}
.v-tool.on{border-color:var(--text);color:var(--text)}
.v-tool .badge{position:absolute;top:4px;right:6px;background:var(--bp-red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-mono)}
.live-line{min-height:48px;max-width:520px;text-align:center;font-size:16px;color:var(--text-2);margin-top:8px}
.chk-item{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;align-items:flex-start;cursor:pointer;background:var(--surface)}
.chk-box{width:18px;height:18px;flex:none;border:1.5px solid var(--border);border-radius:3px;display:grid;place-items:center;margin-top:1px}
.chk-box.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chk-box.ai{background:var(--bp-red);border-color:var(--bp-red);color:#fff}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;background:var(--surface-3);border-radius:2px;overflow:hidden;cursor:pointer;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-family:var(--font-mono);font-size:10px;padding:1px 5px}
.tl{position:relative;height:28px;cursor:pointer}
.tl .track{position:absolute;left:0;right:0;top:12px;height:4px;background:var(--surface-3)}
.tl .prog{position:absolute;left:0;top:12px;height:4px;background:var(--text)}
.tl .mk{position:absolute;top:6px;width:3px;height:16px;background:var(--bp-red)}
.tr-line{display:flex;gap:12px;padding:6px 8px;border-radius:3px;cursor:pointer;font-size:14px}
.tr-line:hover{background:var(--surface-2)}
.tr-line.cur{background:var(--bp-red-50)}
:root[data-theme="night"] .tr-line.cur{background:rgba(255,61,71,.15)}
.tr-line .tc{font-family:var(--font-mono);font-size:11px;color:var(--text-3);padding-top:3px;width:42px;flex:none}
.finding{border:1px solid var(--border-soft);border-left:3px solid var(--sev-min);background:var(--surface);border-radius:2px;padding:16px}
.finding.critique{border-left-color:var(--sev-crit)}.finding.majeur{border-left-color:var(--sev-maj)}.finding.positif{border-left-color:var(--sev-pos)}
.finding.rejected{opacity:.5}
.quote{border-left:2px solid var(--border);padding:2px 0 2px 12px;margin:10px 0;font-size:14px;color:var(--text-2);font-style:italic}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;list-style:none}
.cam-screen{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;color:#fff}
.chat{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:4px;font-size:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--text);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border-soft)}
.gauge-num{font-size:44px;font-weight:800;letter-spacing:-.03em}
.kpi{padding:16px;border:1px solid var(--border-soft);border-radius:4px;background:var(--surface)}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-family:var(--font-sans)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:var(--bp-deep-red);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
@media (max-width:800px){.login{grid-template-columns:1fr}.login-art{min-height:220px;padding:28px}}
.role-card{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px;border:1px solid var(--border);border-radius:4px;background:var(--surface)}
.role-card:hover{border-color:var(--text)}
.role-card.on{border-color:var(--text);box-shadow:inset 3px 0 0 var(--bp-red)}
@media print{
  .side,.no-print,.collapse-btn{display:none!important}
  .main{overflow:visible}body,html,#root,.shell{height:auto}
  .page{padding:0;max-width:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

function mkAudit(o) {
  const t = AUDIT_TYPES[o.type];
  const base = o.base ?? 65;
  const scores = {};
  t.domains.forEach((d, i) => { scores[d] = o.scores?.[d] ?? Math.max(28, Math.min(95, Math.round(base + Math.sin(i * 1.7 + base) * 14))); });
  const score = Math.round(Object.values(scores).reduce((a, b) => a + b, 0) / t.domains.length);
  let findings = (o.findings || GENERIC_FINDINGS[o.type].map(f => ({ sev: f[0], domain: f[1], title: f[2], obs: f[3], reco: f[4], quote: "", quoteFr: "", who: "", t: 0 })))
    .map((f, i) => ({ id: o.ref + "-F" + (i + 1), validation: o.status === "À valider" ? "pending" : "accepted", photos: [], ...f }));
  const actions = findings.filter(f => f.sev !== "positif" && f.reco).map((f, i) => ({
    id: o.ref.replace("INS-", "A-") + "-" + (i + 1), label: f.reco, finding: f.id,
    owner: i % 2 ? "Responsable qualité fournisseur" : "Directeur de site",
    due: addDays(o.date, f.sev === "critique" ? 7 : f.sev === "majeur" ? 30 : 60),
    status: o.actionStatus?.[i] || (i === 0 ? "en cours" : "ouvert"), updates: [],
  }));
  return { source: "mine", org: CLIENT_ORG, author: "Xavier Tinel", lang: "fr", scores, score, findings, actions, transcript: o.transcript || [], photos: [], checklist: {}, consent: null, ...o, scores, score, findings, actions };
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }

/* ---------- storage : IndexedDB, clé / valeur, hors ligne ---------- */
const storage = (() => {
  let dbp = null; const mem = {};
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("inspecto", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    async get(k) { const db = await open(); if (!db) return mem[k]; return new Promise(res => { try { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(mem[k]); } }); },
    async set(k, v) { const db = await open(); mem[k] = v; if (!db) return; return new Promise(res => { try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } }); },
    async clear() { const db = await open(); Object.keys(mem).forEach(k => delete mem[k]); if (!db) return; return new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").clear(); tx.oncomplete = res; }); },
  };
})();

const blobToB64 = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ media_type: b.type || "image/jpeg", data: r.result.split(",")[1] }); r.onerror = rej; r.readAsDataURL(b); });
const extractJson = (s) => { s = s.replace(/```(?:json)?/g, ""); const a = s.indexOf("{"), b = s.lastIndexOf("}"); return JSON.parse(a >= 0 && b > a ? s.slice(a, b + 1) : s); };
const localSampler = (() => {
  async function call(messages, opts = {}) {
    const images = opts.images ? await Promise.all(opts.images.map(blobToB64)) : undefined;
    let r;
    try { r = await fetch("/api/sample", { method: "POST", headers: { "content-type": "application/json" }, signal: opts.signal, body: JSON.stringify({ messages, modelTier: opts.modelTier, images }) }); }
    catch (e) { throw e.name === "AbortError" ? { code: "cancelled" } : { code: "unavailable", message: e.message }; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: d.code || "api_error", message: d.error || r.statusText };
    opts.onText?.({ text: d.text });
    return { text: d.text };
  }
  const s = (messages, opts) => call(messages, opts);
  s.json = async (prompt, opts = {}) => {
    const { text } = await call(prompt, opts);
    try { return extractJson(text); } catch (e) {
      const retry = await call([{ role: "user", content: prompt }, { role: "assistant", content: text }, { role: "user", content: "Ta réponse n'est pas un JSON valide (" + e.message + "). Réponds UNIQUEMENT avec le JSON corrigé, sans prose." }], { ...opts, images: undefined });
      return extractJson(retry.text);
    }
  };
  s.limits = async () => ({ images: { maxCount: 5 } });
  return s;
})();

  async function available() { return !!(await get()); }

/* ---------- speech : reconnaissance vocale du navigateur (Edge/Chrome), langue changeable en cours ---------- */
const SR_CODES = { fr: "fr-FR", en: "en-US", es: "es-ES", ar: "ar-SA" };
function createSpeech(lang, onLine, onPartial, onStatus = () => {}) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, running = false, mode = SR ? "idle" : "unsupported", cur = lang;
  function boot() {
    if (!SR) { mode = "unsupported"; onStatus(mode); return; }
    try {
      rec = new SR(); rec.lang = SR_CODES[cur] || navigator.language || "fr-FR"; rec.continuous = true; rec.interimResults = true; mode = "live"; onStatus(mode);
      rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) { const t = r[0].transcript.trim(); if (t) onLine(t, cur); onPartial(""); } else onPartial(r[0].transcript); } };
      rec.onerror = (e) => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) { rec = null; mode = "denied"; onStatus(mode); } else if (e.error === "network") { mode = "network"; onStatus(mode); } };
      rec.onend = () => { if (running && rec) try { rec.start(); } catch (e) {} };
      rec.start();
    } catch (e) { rec = null; mode = "unsupported"; onStatus(mode); }
  }
  return {
    get mode() { return mode; },
    start() { running = true; boot(); },
    stop() { running = false; if (rec) { const r = rec; rec = null; try { r.stop(); } catch (e) {} } },
    setLang(l) { cur = l; if (running) { const r = rec; rec = null; try { r?.stop(); } catch (e) {} boot(); } },
  };
}

  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const g = c.getContext("2d"); g.drawImage(img, 0, 0);

}

/* =========================================================================
   COMPARER
   ========================================================================= */
function Compare({ go }) {
  const st = useStore();
  const sel = st.compare.map(id => st.audits.find(a => a.id === id)).filter(Boolean);
  const pool = st.audits.filter(a => st.visible(a) && !st.compare.includes(a.id));
  const type = sel[0] ? AUDIT_TYPES[sel[0].type] : null;
  const sameType = sel.every(a => a.type === sel[0]?.type);
  const domains = sameType && type ? type.domains : [...new Set(sel.flatMap(a => AUDIT_TYPES[a.type].domains))];
  const recurrent = useMemo(() => { const m = {}; sel.forEach(a => a.findings.filter(f => f.sev !== "positif").forEach(f => { m[f.domain] = (m[f.domain] || 0) + 1; })); return Object.entries(m).filter(([, n]) => n > 1).sort((x, y) => y[1] - x[1]); }, [sel]);
  return <div className="page">
    <div className="page-head"><div style={{ flex: 1 }}><Eyebrow rule>Analyse</Eyebrow><h1 className="h1">Comparer</h1><p className="muted" style={{ margin: "6px 0 0" }}>Entre sites, ou dans le temps pour un même site. Jusqu'à 4 audits.</p></div>
      <select className="input" style={{ width: 300 }} value="" onChange={e => e.target.value && st.toggleCompare(e.target.value)} disabled={sel.length >= 4}><option value="">Ajouter un audit…</option>{pool.map(a => <option key={a.id} value={a.id}>{a.site} · {frDate(a.date)} · {a.score}</option>)}</select>
    </div>
    {!sel.length ? <div className="card empty">Sélectionnez des audits depuis la bibliothèque ou avec le menu ci-dessus.</div> : <>
      {!sameType && <div className="card card-pad" style={{ marginBottom: 16, fontSize: 14 }}>Les audits sélectionnés utilisent des grilles différentes : seuls les domaines communs sont comparables directement.</div>}
      <div className="grid" style={{ gridTemplateColumns: `repeat(${sel.length}, minmax(180px,1fr))`, overflowX: "auto" }}>
        {sel.map((a, i) => <div key={a.id} className="card card-pad" style={i === 0 ? { boxShadow: "inset 0 3px 0 var(--bp-red)" } : null}>
          <div className="row between"><span className="mono faint" style={{ fontSize: 11 }}>{a.ref}</span><button className="icon-btn" style={{ width: 28, height: 28 }} onClick={() => st.toggleCompare(a.id)}><Icon n="x" s={14} /></button></div>
          <div className="h3">{a.site}</div><div className="faint" style={{ fontSize: 13 }}>{frDate(a.date)}</div>
          <div className="row" style={{ marginTop: 10 }}><span className="gauge-num">{a.score}</span><span className="faint">/100 · {grade(a.score)}</span></div>
          {i > 0 && <div className="mono" style={{ fontSize: 12 }}>{a.score - sel[0].score >= 0 ? "+" : ""}{a.score - sel[0].score} vs {sel[0].site === a.site ? "audit de référence" : sel[0].site}</div>}
        </div>)}
      </div>
      <div className="card card-pad scroll-x" style={{ marginTop: 16 }}>
        <table className="tbl"><thead><tr><th>Domaine</th>{sel.map(a => <th key={a.id}>{a.site.split(" ")[0]} {a.date.slice(0, 4)}</th>)}<th>Écart max</th></tr></thead>
          <tbody>{domains.map(d => { const v = sel.map(a => a.scores[d]); const def = v.filter(x => x != null); const gap = def.length > 1 ? Math.max(...def) - Math.min(...def) : 0;
            return <tr key={d}><td>{d}</td>{v.map((x, i) => <td key={i}>{x == null ? <span className="faint">n/a</span> : <div style={{ minWidth: 110 }}><b>{x}</b><div className="bar" style={{ marginTop: 4 }}><b className={x < 50 ? "red" : ""} style={{ width: x + "%" }} /></div></div>}</td>)}<td><b style={gap >= 20 ? { boxShadow: "inset 0 -3px 0 var(--bp-red)" } : null}>{gap}</b></td></tr>; })}</tbody></table>
      </div>
      <div className="two-col" style={{ marginTop: 16 }}>
        {sameType && <div className="card card-pad"><div className="eyebrow" style={{ marginBottom: 8 }}>Profil</div><Radar domains={domains} a={sel[0].scores} b={sel[1]?.scores} size={320} /><div className="faint" style={{ fontSize: 12 }}>Plein : {sel[0].site} {sel[0].date.slice(0, 4)} · Pointillé rouge : {sel[1] ? sel[1].site + " " + sel[1].date.slice(0, 4) : "–"}</div></div>}
        <div className="card card-pad"><div className="eyebrow" style={{ marginBottom: 8 }}>Constats récurrents par domaine</div>
          {recurrent.length ? recurrent.map(([d, n]) => <div key={d} className="row between" style={{ padding: "8px 0", borderBottom: "1px solid var(--border-soft)" }}><span>{d}</span><span className="mono">{n} constats</span></div>) : <div className="faint">Aucun domaine récurrent.</div>}
        </div>
      </div>
    </>}
  </div>;
}

  const kept = a.findings.filter(f => f.validation !== "rejected");

function synthTrace(a) {
  const lines = a.transcript || []; if (!lines.length) return [];
  let la = 25.6866, ln = -100.3161, dir = .6; const out = [];
  const end = lines.at(-1)[0] + 60;
  for (let t = 0; t <= end; t += 20) { dir += (Math.sin(t / 140) + (t % 7) / 14 - .25) * .5; la += Math.cos(dir) * .00006; ln += Math.sin(dir) * .00006; out.push({ t, lat: la, lng: ln }); }
  return out;
}
function VisitPlayback({ audit: a }) {
  const st = useStore(); const wide = useWide(1000);
  const lines = useMemo(() => (a.transcript || []).map(l => ({ t: l[0], text: l[1] })), [a.transcript]);
  const photos = a.photos || [];
  const base = SPOKEN.includes(a.lang) ? a.lang : "fr";
  const [lang, setLang] = useState(base); const [cur, setCur] = useState(0); const [playing, setPlaying] = useState(false); const [busy, setBusy] = useState(false); const [tab, setTab] = useState("transcript");
  const total = Math.max(lines.at(-1)?.t + 45 || 60, 60);
  const trace = useMemo(() => (a.trace?.length ? a.trace : synthTrace(a)), [a.id]);
  const tr = lang === base ? null : (a.translations || {})[lang];
  const audioRef = useRef(null); const urls = useRef({}); const [seek, setSeek] = useState(0);
  const jump = (t) => { setCur(t); setSeek(s => s + 1); };
  const recAt = (t) => (a.recordings || []).find(r => r.audio && t >= r.offset && t < r.offset + r.duration);
  useEffect(() => {
    const au = audioRef.current; if (!playing) { au?.pause(); return; }
    const r = recAt(cur);
    if (r && au) {
      if (!urls.current[r.id]) urls.current[r.id] = URL.createObjectURL(r.audio);
      if (au.dataset.rec !== r.id) { au.src = urls.current[r.id]; au.dataset.rec = r.id; }
      const want = cur - r.offset; if (Math.abs(au.currentTime - want) > 1.5) au.currentTime = want;
      au.play().catch(() => {}); return;
    }
    au?.pause();
    const i = setInterval(() => setCur(c => { if (c + 1 >= total) { setPlaying(false); return total; } const n = c + 1; if (recAt(n)) setSeek(s => s + 1); return n; }), 1000); return () => clearInterval(i);
  }, [playing, total, seek]);
  useEffect(() => () => Object.values(urls.current).forEach(u => URL.revokeObjectURL(u)), []);
  useEffect(() => {
    if (lang === base || tr || !lines.length) return; setBusy(true);
    ai.json(prompts.translate(lines, lang), { modelTier: "quick" })
      .then(r => st.updateAudit(a.id, x => ({ ...x, translations: { ...(x.translations || {}), [lang]: r.lines } })))
      .catch(e => { st.toast(aiErr(e)); setLang(base); }).finally(() => setBusy(false));
  }, [lang]);
  const curLine = [...lines].reverse().find(l => l.t <= cur);
  const sections = useMemo(() => [...(a.sections || CASE_SECTIONS[a.id] || [])].sort((x, y) => x.t - y.t), [a.sections, a.id]);

  const PlanEl = a.plan ? <PlanImageView plan={a.plan} sections={sections} secName={secLabel} cur={cur} onSeek={jump} /> : <PlanView v={{ trace, photos }} cur={cur} range={[0, total]} onSeek={jump} />;
  const Chapters = <div className="no-print" style={{ marginBottom: 14 }}>

      : <button className="btn btn-sm" disabled={secBusy} onClick={genSections}>{secBusy ? <><span className="spinner" />Découpage…</> : <><Icon n="sparkle" s={14} />Générer les chapitres de la visite</>}</button>}
  </div>;
  const Transcript = <div className="card card-pad" style={{ maxHeight: wide ? 520 : "none", overflow: "auto" }}>
    {lines.map((l, i) => { const ph = photos.filter(p => p.t > (lines[i - 1]?.t ?? -1) && p.t <= l.t);
      const secs = sections.filter(x => x.t <= l.t && x.t > (lines[i - 1]?.t ?? -1));

function ChatDrawer({ audit, onClose }) {
  const t = AUDIT_TYPES[audit.type];
  const [msgs, setMsgs] = useState([{ role: "assistant", content: `Posez une question sur l'audit ${audit.site}. Par exemple : « Qu'a dit le site sur la maintenance ? » ou « Quelles actions sont en retard ? »` }]);
  const [q, setQ] = useState(""); const [busy, setBusy] = useState(false); const end = useRef(null); const ctl = useRef(null);
  useEffect(() => { end.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs]);
  async function send(text) {
    text = (text || q).trim(); if (!text || busy) return; setQ("");
    const hist = [...msgs.slice(1), { role: "user", content: text }];
    setMsgs(m => [...m, { role: "user", content: text }, { role: "assistant", content: "Réflexion…" }]); setBusy(true);
    const turns = [{ role: "user", content: prompts.chat(audit, t) + "\n\nQuestion : " + hist[0].content }, ...hist.slice(1)];
    if (hist.length === 1) turns.length = 1;
    ctl.current = new AbortController();
    try {
      const s = await ai.raw(); if (!s) throw { code: "unavailable" }; if (!navigator.onLine) throw { code: "offline" };
      await s(turns, { cache: false, signal: ctl.current.signal, onText: ({ text }) => setMsgs(m => [...m.slice(0, -1), { role: "assistant", content: text }]) });
    } catch (e) { setMsgs(m => [...m.slice(0, -1), { role: "assistant", content: e.text || aiErr(e) }]); }
    setBusy(false);
  }
  return <><div className="modal-bg" style={{ background: "rgba(0,0,0,.25)" }} onClick={onClose} /><aside className="drawer"><div className="chat">
    <div className="row between" style={{ padding: "16px 20px", borderBottom: "1px solid var(--border-soft)" }}><div><div className="eyebrow">Assistant Inspecto</div><div className="h3">{audit.site}</div></div><button className="icon-btn" onClick={onClose}><Icon n="x" /></button></div>
    <div className="chat-msgs">{msgs.map((m, i) => <div key={i} className={"msg " + (m.role === "user" ? "u" : "a")}>{m.content}</div>)}<div ref={end} /></div>
    <div className="row wrap" style={{ padding: "0 16px 8px", gap: 6 }}>{["Résume les points bloquants", "Quelles actions sont en retard ?", "Que faut-il vérifier à l'audit de suivi ?"].map(s => <button key={s} className="tag" style={{ background: "var(--surface)", cursor: "pointer" }} onClick={() => send(s)}>{s}</button>)}</div>
    <div className="row" style={{ padding: 16, borderTop: "1px solid var(--border-soft)" }}><input className="input" value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder="Votre question…" />{busy ? <button className="btn" onClick={() => ctl.current?.abort()}>Stop</button> : <button className="btn btn-dark" onClick={() => send()}><Icon n="send" s={16} /></button>}</div>
  </div></aside></>;
}

/* =========================================================================
   APP DE VISITE · mobile d'abord, hors ligne (IndexedDB)
   Écrans : accueil → formulaire → consentement RGPD → capture → synthèse
   ========================================================================= */
const LANGS = { auto: "Détection auto", fr: "Français", en: "Anglais", es: "Espagnol", ar: "Arabe" };
const serverInfo = location.protocol.startsWith("http") && !window.claude ? fetch("/api/info").then(r => r.json()).catch(() => ({})) : Promise.resolve({});
function newVisit(p) {
  return { id: uid(), code: shareCode(), name: "", site: "", date: today(), place: "", gps: null, lang: "fr", type: "qualif-indus", sector: "Usine", team: [], consent: null,
    recordings: [], lines: [], photos: [], trace: [], checklist: {}, followup: null, translations: {}, sections: null, analysis: null, pendingAnalysis: false, auditId: null, createdAt: Date.now(), ...p };
}
function elapsedOf(segs, now = Date.now()) { return segs.reduce((s, g) => s + ((g.end || now) - g.start), 0) / 1000; }

function VisitApp({ query, go }) {
  const st = useStore();
  const [screen, setScreen] = useState("home"); const [vid, setVid] = useState(null);
  const v = st.visits.find(x => x.id === vid);
  const save = (patch) => st.updateVisit(vid, typeof patch === "function" ? patch : (x) => ({ ...x, ...patch }));
  useEffect(() => {
    const p = new URLSearchParams(query);
    if (p.get("followup")) { const a = st.audits.find(x => x.id === p.get("followup")); if (a) { setScreen("form"); setVid(null); window.__prefill = a; } }
    if (p.get("join")) setScreen("join:" + p.get("join"));
  }, [query]);
  const back = () => { if (screen === "home") go("/"); else if (screen === "synth") setScreen("capture"); else setScreen("home"); };
  if (screen === "form") return <VisitForm onBack={back} onCreate={(nv) => { st.addVisit(nv); setVid(nv.id); setScreen("consent"); }} />;
  if (screen === "consent" && v) return <Consent v={v} onBack={back} onOk={(c) => { save({ consent: c }); setScreen("capture"); }} />;
  if (screen === "capture" && v) return <Capture v={v} save={save} onBack={() => setScreen("home")} onSynth={() => setScreen("synth")} />;
  if (screen === "synth" && v) return <Synthesis v={v} save={save} onBack={back} go={go} />;
  if (screen.startsWith("join")) return <Join initial={screen.split(":")[1] || ""} onBack={() => setScreen("home")} onJoin={(id) => { setVid(id); setScreen("capture"); }} />;
  return <VisitHome go={go} onNew={() => { window.__prefill = null; setScreen("form"); }} onOpen={(id) => { setVid(id); const x = st.visits.find(y => y.id === id); setScreen(x?.consent ? "capture" : "consent"); }} onJoin={() => setScreen("join")} />;
}

function VTop({ onBack, title, sub, right }) {
  return <div className="v-top"><button className="icon-btn" onClick={onBack} aria-label="Retour"><Icon n="chevL" /></button>
    <div style={{ flex: 1, minWidth: 0, textAlign: "center" }}><div style={{ fontWeight: 700, fontSize: 15, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{title}</div>{sub && <div className="faint" style={{ fontSize: 12 }}>{sub}</div>}</div>
    <div className="row" style={{ gap: 4, minWidth: 38, justifyContent: "flex-end" }}>{right}</div></div>;
}

/* Export / import d'une visite (JSON autonome : photos, audio en base64, plan, transcription) pour passer
   d'une capture locale (micro autorisé) à l'Artifact claude.ai (IA du compte). */
const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportVisit(v) {
  const recordings = await Promise.all(v.recordings.map(async r => ({ ...r, audio: r.audio instanceof Blob ? await blobToDataUrl(r.audio) : null })));
  return JSON.stringify({ inspectoVisit: 1, exportedAt: new Date().toISOString(), visit: { ...v, recordings } });
}
function importVisit(json, existingIds) {
  const d = JSON.parse(json); if (!d?.inspectoVisit || !d.visit) throw new Error("Ce fichier n'est pas une visite Inspecto");
  const v = d.visit; v.recordings = (v.recordings || []).map(r => ({ ...r, audio: typeof r.audio === "string" && r.audio.startsWith("data:") ? dataUrlToBlob(r.audio) : null }));
  if (existingIds.includes(v.id)) v.id = uid();
  v.auditId = null; return v;
}
async function saveFile(filename, data, type) {
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { await dl.save({ filename, data }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function VisitHome({ go, onNew, onOpen, onJoin }) {
  const st = useStore(); const last = [...st.visits].sort((a, b) => b.createdAt - a.createdAt);
  const [share, setShare] = useState(null); const importRef = useRef(null);
  const doExport = async (x) => { try { st.toast("Préparation de l'export…"); await saveFile("Visite-" + (x.name || x.code).replace(/[^\w-]+/g, "_") + ".inspecto.json", await exportVisit(x), "application/json"); } catch (e) { if (e?.code !== "declined") st.toast("Export impossible : " + (e?.message || e?.code)); } };
  const doImport = async (files) => { for (const f of files) { try { const v = importVisit(await f.text(), st.visits.map(x => x.id)); st.addVisit(v); st.toast("Visite importée : " + v.name); } catch (e) { st.toast("Import impossible : " + e.message); } } };
  return <div className="page" style={{ maxWidth: 900 }}>
    <div className="page-head"><div style={{ flex: 1 }}><Eyebrow rule>App de visite</Eyebrow><h1 className="h1">Nouvel audit</h1><p className="muted" style={{ margin: "6px 0 0" }}>Fonctionne hors ligne. Les médias restent sur l'appareil jusqu'à la synchronisation.</p></div></div>
    <div className="row wrap" style={{ gap: 10, marginBottom: 24 }}>
      <button className="btn btn-red" style={{ height: 48, padding: "0 22px", fontSize: 15 }} onClick={onNew}><Icon n="mic" />Lancer une visite</button>
      <button className="btn" style={{ height: 48 }} onClick={onJoin}><Icon n="users" />Rejoindre une visite</button>
    </div>
    {last[0] && <div className="card card-pad row wrap" style={{ gap: 20, marginBottom: 24 }}>
      <QR text={location.href.split("#")[0] + "#/visit?join=" + last[0].code} size={112} />
      <div style={{ flex: 1, minWidth: 200 }}><div className="eyebrow">Invitez un collègue sur la même visite</div><div className="h3" style={{ marginTop: 6 }}>{last[0].name}</div><div className="mono" style={{ fontSize: 26, letterSpacing: ".2em", fontWeight: 600, marginTop: 6 }}>{last[0].code}</div>
        <div className="row" style={{ marginTop: 10 }}><button className="btn btn-sm" onClick={() => setShare(last[0])}><Icon n="share" s={14} />Partager</button></div></div>
    </div>}
    <div className="row between" style={{ marginBottom: 10 }}><div className="eyebrow">Reprendre une visite</div>
      <input ref={importRef} type="file" accept=".json,application/json" multiple hidden onChange={e => { doImport([...e.target.files]); e.target.value = ""; }} />
      <button className="btn btn-sm" onClick={() => importRef.current?.click()}><Icon n="img" s={14} />Importer une visite (.json)</button></div>
    {window.claude && <div className="card card-pad" style={{ fontSize: 13, marginBottom: 12, boxShadow: "inset 3px 0 0 var(--bp-red)" }}><b>Micro indisponible dans claude.ai.</b> Capturez la visite dans Inspecto local (Edge : http://localhost:3000), exportez-la depuis cette même liste, puis importez le fichier ici pour l'analyse IA avec votre compte.</div>}
    {last.length ? <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fill,minmax(250px,1fr))" }}>{last.map(x => <div key={x.id} className="card card-pad" style={{ position: "relative" }}>
      <button style={{ textAlign: "left", border: 0, background: "none", padding: 0, width: "100%", cursor: "pointer", color: "inherit", font: "inherit" }} onClick={() => onOpen(x.id)}>
        <div className="h3" style={{ paddingRight: 36 }}>{x.name}</div><div className="faint" style={{ fontSize: 13 }}>{x.place || "Lieu non renseigné"} · {frDate(x.date)}</div>
        <div className="row mono" style={{ fontSize: 12, marginTop: 10, gap: 14 }}><span>{x.photos.length} photos</span><span>{x.recordings.length} enreg.</span>{x.auditId ? <span>Classée</span> : x.pendingAnalysis ? <span style={{ color: "var(--bp-red)" }}>Analyse en attente</span> : null}</div></button>
      <button className="icon-btn" title="Exporter la visite (fichier .inspecto.json)" style={{ position: "absolute", top: 8, right: 40 }} onClick={() => doExport(x)}><Icon n="download" s={15} /></button>
      <button className="icon-btn" title="Supprimer la visite" style={{ position: "absolute", top: 8, right: 8 }} onClick={() => { if (confirm(`Supprimer la visite « ${x.name} » ?\n${x.photos.length} photo(s) et ${x.recordings.length} enregistrement(s) seront perdus${x.auditId ? " (le rapport d'audit classé est conservé)" : ""}.`)) { st.removeVisit(x.id); st.toast("Visite supprimée"); } }}><Icon n="trash" s={15} /></button>
    </div>)}</div>
      : <div className="card empty">Aucune visite sur cet appareil.</div>}
    {share && <ShareSheet v={share} onClose={() => setShare(null)} />}
  </div>;
}

/* Relais photos mobile : URL Netlify configurée, sinon le serveur local sur le Wi-Fi. */
async function relayInfo() {
  const custom = (ls.get("insp.relay", "") || "").replace(/\/$/, "");
  if (custom) return { base: custom, page: custom + "/", kind: "netlify" };
  const info = await serverInfo; const lan = (info.lanUrl || (location.protocol.startsWith("http") && !window.claude ? location.origin : "")).replace(/\/$/, "");
  return lan ? { base: lan, page: lan + "/mobile", kind: "lan" } : null;
}
const mobileLink = (r, code) => r ? `${r.page}?code=${code}&api=${encodeURIComponent(r.base)}` : "";
function useRelay() { const [r, setR] = useState(null); const [tick, setTick] = useState(0); useEffect(() => { relayInfo().then(setR); }, [tick]); return [r, () => setTick(t => t + 1)]; }

function QrPanel({ v }) {
  const [relay] = useRelay(); const mlink = mobileLink(relay, v.code);
  return <div className="card card-pad" style={{ marginTop: 8 }}>
    <div className="eyebrow" style={{ marginBottom: 8 }}>Photos depuis un téléphone</div>
    <div className="row" style={{ gap: 14, alignItems: "flex-start" }}>{mlink ? <QR text={mlink} size={120} /> : <div className="faint" style={{ fontSize: 12 }}>Relais indisponible</div>}
      <div style={{ fontSize: 13 }}><div className="mono" style={{ fontSize: 22, letterSpacing: ".18em", fontWeight: 600 }}>{v.code}</div><p className="faint" style={{ margin: "6px 0 0", fontSize: 12 }}>Scannez : la page ouverte permet de prendre des photos, envoyées dans cette visite en quelques secondes. Aucun compte requis.</p></div></div>
  </div>;
}

function ShareSheet({ v, onClose }) {
  const st = useStore(); const link = location.href.split("#")[0] + "#/visit?join=" + v.code;
  const [relay, refresh] = useRelay(); const [edit, setEdit] = useState(false); const [url, setUrl] = useState(ls.get("insp.relay", "") || "");
  const mlink = mobileLink(relay, v.code);
  return <Modal onClose={onClose}><div className="row between"><div className="h2">Téléphone et collègues</div><button className="icon-btn" onClick={onClose}><Icon n="x" /></button></div>
    <div className="row wrap" style={{ gap: 20, marginTop: 16, alignItems: "flex-start" }}>{mlink ? <QR text={mlink} size={170} /> : <div className="card" style={{ width: 170, height: 170, display: "grid", placeItems: "center", fontSize: 12, textAlign: "center", padding: 12 }} >Relais indisponible : renseignez l'URL Netlify ci-dessous</div>}
      <div style={{ flex: 1, minWidth: 220 }}><div className="eyebrow">Code de la visite</div><div className="mono" style={{ fontSize: 32, letterSpacing: ".2em", fontWeight: 600 }}>{v.code}</div>
        <p style={{ fontSize: 14, margin: "8px 0" }}><b>Scannez avec le téléphone</b> : une page s'ouvre pour prendre des photos, elles arrivent dans cette visite en quelques secondes.</p>
        {mlink && <input className="input mono" style={{ fontSize: 12 }} readOnly value={mlink} onFocus={e => e.target.select()} />}
        <div className="row wrap" style={{ marginTop: 8 }}>{mlink && <button className="btn btn-sm" onClick={() => { navigator.clipboard?.writeText(mlink).then(() => st.toast("Lien copié"), () => st.toast("Copie impossible")); }}><Icon n="link" s={14} />Copier</button>}
          <button className="btn btn-sm btn-ghost" onClick={() => setEdit(!edit)}><Icon n="edit" s={14} />{relay?.kind === "netlify" ? "Relais : Netlify" : relay ? "Relais : Wi-Fi local" : "Configurer le relais"}</button></div>
        {edit && <div className="grid" style={{ gap: 6, marginTop: 8 }}><input className="input" placeholder="https://votre-site.netlify.app" value={url} onChange={e => setUrl(e.target.value)} />
          <div className="row"><button className="btn btn-sm btn-dark" onClick={() => { ls.set("insp.relay", url.trim()); setEdit(false); refresh(); st.toast(url.trim() ? "Relais enregistré" : "Relais local"); }}>Enregistrer</button><span className="faint" style={{ fontSize: 12 }}>Vide = serveur local (téléphone sur le même Wi-Fi).</span></div></div>}
      </div></div>
    <div className="divider" /><div className="row wrap between"><div><div className="eyebrow">Rejoindre la visite depuis un autre poste</div><input className="input mono" style={{ fontSize: 12, marginTop: 6, width: 360, maxWidth: "100%" }} readOnly value={link} onFocus={e => e.target.select()} /></div></div>
    <div className="divider" /><div className="eyebrow" style={{ marginBottom: 8 }}>Participants</div>
    <div className="row wrap">{(v.team.length ? v.team : [st.user.name]).map(n => <div key={n} className="row" style={{ gap: 8 }}><div className="avatar" style={{ width: 28, height: 28, fontSize: 11 }}>{n.split(" ").map(s => s[0]).join("").slice(0, 2)}</div><span style={{ fontSize: 14 }}>{n}</span></div>)}</div></Modal>;
}

function Join({ initial, onBack, onJoin }) {
  const st = useStore(); const [code, setCode] = useState(initial.toUpperCase());
  const join = () => {
    let v = st.visits.find(x => x.code === code);
    if (!v) { v = newVisit({ code, name: "Visite partagée " + code, team: ["Hôte de la visite", st.user.name], consent: { at: new Date().toISOString(), participants: "Consentement recueilli par l'hôte", byHost: true } }); st.addVisit(v); }
    else st.updateVisit(v.id, x => ({ ...x, team: [...new Set([...(x.team.length ? x.team : [st.user.name]), st.user.name])] }));
    onJoin(v.id);
  };
  return <div className="visit"><VTop onBack={onBack} title="Rejoindre une visite" />
    <div className="v-center"><div style={{ width: "100%", maxWidth: 380, marginTop: 30 }}>
      <div className="card" style={{ aspectRatio: "1", display: "grid", placeItems: "center", background: "var(--surface-2)", marginBottom: 20 }}><div style={{ textAlign: "center" }}><Icon n="cam" s={40} w={1.5} /><div className="faint" style={{ fontSize: 13, marginTop: 8 }}>Scannez le QR code avec l'appareil photo<br />du téléphone, ou saisissez le code</div></div></div>
      <input className="input mono" style={{ height: 56, fontSize: 26, textAlign: "center", letterSpacing: ".3em", textTransform: "uppercase" }} maxLength={6} value={code} onChange={e => setCode(e.target.value.toUpperCase())} placeholder="CODE" />
      <button className="btn btn-dark" style={{ width: "100%", justifyContent: "center", height: 46, marginTop: 12 }} disabled={code.length !== 6} onClick={join}>Rejoindre</button>
    </div></div></div>;
}

function VisitForm({ onBack, onCreate }) {
  const st = useStore(); const pre = window.__prefill;
  const [v, setV] = useState(() => newVisit(pre ? { name: "Audit de suivi · " + pre.site, site: pre.site, place: pre.city + ", " + pre.country, type: pre.type, followup: pre.id, lang: SPOKEN.includes(pre.lang) ? pre.lang : "en" } : {}));
  const [locMode, setLocMode] = useState(pre ? "manual" : "gps"); const [gpsState, setGpsState] = useState(""); const planRef = useRef(null);
  const [genOpen, setGenOpen] = useState(false);
  const s = (k) => (e) => setV({ ...v, [k]: e.target.value });
  useEffect(() => {
    if (locMode !== "gps") return; setGpsState("Localisation…");
    if (!navigator.geolocation) { setGpsState("GPS indisponible, passez en saisie manuelle"); return; }
    navigator.geolocation.getCurrentPosition(p => { setV(x => ({ ...x, gps: { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }, place: x.place || `${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}` })); setGpsState(""); },
      () => setGpsState("Position refusée ou indisponible dans cette vue"), { enableHighAccuracy: true, timeout: 8000 });
  }, [locMode]);
  const types = Object.entries(AUDIT_TYPES);
  return <div className="visit"><VTop onBack={onBack} title={pre ? "Audit de suivi" : "Nouvelle visite"} />
    <div className="v-center"><div className="grid" style={{ width: "100%", maxWidth: 520, gap: 16 }}>
      {pre && <div className="card card-pad" style={{ fontSize: 14, boxShadow: "inset 3px 0 0 var(--bp-red)" }}>Les {pre.actions.filter(a => a.status !== "fait").length} actions encore ouvertes de l'audit {pre.ref} seront ajoutées à la grille de visite pour vérification.</div>}
      <div className="field"><label>Nom de la visite</label><input className="input" value={v.name} onChange={s("name")} placeholder="Ex. Qualification Metalúrgica Norte" /></div>
      <div className="row"><div className="field" style={{ flex: 1 }}><label>Site audité</label><input className="input" value={v.site} onChange={s("site")} placeholder="Nom du fournisseur" /></div><div className="field" style={{ width: 170 }}><label>Date</label><input className="input" type="date" value={v.date} onChange={s("date")} /></div></div>
      <div className="field"><label>Secteur</label><div className="seg" style={{ alignSelf: "flex-start", flexWrap: "wrap" }}>{SECTORS.map(k => <button key={k} className={v.sector === k ? "on" : ""} onClick={() => setV({ ...v, sector: k })}>{k}</button>)}</div></div>
      <div className="field"><label>Type d'audit et grille</label><select className="input" value={v.type} onChange={s("type")}>{types.map(([k, t]) => <option key={k} value={k}>{t.label}</option>)}</select>
        <div className="faint" style={{ fontSize: 12 }}>{AUDIT_TYPES[v.type].items.length} points · {AUDIT_TYPES[v.type].refs.join(" · ")}</div>
        <button className="btn btn-ghost btn-sm" style={{ alignSelf: "flex-start", paddingLeft: 0 }} onClick={() => setGenOpen(true)}><Icon n="sparkle" s={14} />Créer une grille pour un autre type d'audit</button></div>
      <div className="field"><label>Lieu et repérage</label><div className="seg" style={{ alignSelf: "flex-start" }}><button className={locMode === "gps" ? "on" : ""} onClick={() => setLocMode("gps")}>GPS</button><button className={locMode === "manual" ? "on" : ""} onClick={() => setLocMode("manual")}>À la main</button><button className={locMode === "plan" ? "on" : ""} onClick={() => setLocMode("plan")}>Avec plan</button></div>
        {locMode === "gps" ? <div className="card card-pad row" style={{ fontSize: 14 }}><Icon n="pin" />{v.gps ? <span><b className="mono">{v.gps.lat.toFixed(5)}, {v.gps.lng.toFixed(5)}</b> <span className="faint">± {Math.round(v.gps.acc)} m</span></span> : <span className="faint">{gpsState}</span>}</div>
          : locMode === "manual" ? <input className="input" value={v.place} onChange={s("place")} placeholder="Adresse ou ville" />
          : <div className="grid" style={{ gap: 8 }}>
            <input className="input" value={v.place} onChange={s("place")} placeholder="Adresse ou nom du bâtiment" />
            <input ref={planRef} type="file" accept="image/*" hidden onChange={async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return; const src = await compressImage(f, 1800); setV(x => ({ ...x, plan: { src, name: f.name, points: {} } })); }} />
            {v.plan ? <div className="card" style={{ overflow: "hidden" }}><img src={v.plan.src} style={{ width: "100%", display: "block", maxHeight: 260, objectFit: "contain", background: "var(--surface-2)" }} /><div className="row" style={{ padding: 8, fontSize: 13 }}><span className="faint" style={{ flex: 1 }}>{v.plan.name}</span><button className="btn btn-sm" onClick={() => planRef.current?.click()}>Changer</button><button className="btn btn-sm" onClick={() => setV(x => ({ ...x, plan: null }))}><Icon n="trash" s={14} /></button></div></div>
              : <button className="card card-pad row" style={{ cursor: "pointer", textAlign: "left", fontSize: 14 }} onClick={() => planRef.current?.click()}><Icon n="img" /><div><b>Importer le plan du site</b><div className="faint" style={{ fontSize: 12 }}>Image (photo du plan d'évacuation, capture d'écran, PNG/JPG). Vous placerez ensuite vos chapitres de visite dessus pour tracer le parcours.</div></div></button>}
          </div>}</div>
      <div className="field"><label>Langue parlée pendant la visite</label><div className="seg" style={{ alignSelf: "flex-start" }}>{Object.entries(LANGS).map(([k, l]) => <button key={k} className={v.lang === k ? "on" : ""} onClick={() => setV({ ...v, lang: k })}>{l}</button>)}</div><div className="faint" style={{ fontSize: 12 }}>Pilote la transcription. La synthèse est traduisible ensuite.</div></div>
      <button className="btn btn-red" style={{ height: 48, justifyContent: "center", marginTop: 8 }} disabled={!v.name.trim()} onClick={() => onCreate({ ...v, team: [st.user.name], site: v.site || v.name })}>Continuer</button>
    </div></div>
    {genOpen && <GridGenerator onClose={() => setGenOpen(false)} onCreated={(k) => { setV({ ...v, type: k }); setGenOpen(false); }} />}
  </div>;
}

function GridGenerator({ onClose, onCreated }) {
  const st = useStore(); const [label, setLabel] = useState(""); const [sector, setSector] = useState(""); const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  async function gen() {
    setBusy(true); setErr("");
    try {
      const r = await ai.json(prompts.grid(label, sector), { modelTier: "default" });
      const k = "custom-" + uid();
      const t = { label, short: label, refs: r.refs || [], domains: r.domains, bench: r.bench || {}, items: (r.items || []).map((it, i) => ({ id: "c" + i, ...it })), custom: true };
      st.addType(k, t); onCreated(k); st.toast("Grille créée : " + t.items.length + " points");
    } catch (e) { setErr(aiErr(e)); }
    setBusy(false);
  }
  return <Modal onClose={onClose}><div className="h2">Nouvelle grille d'audit</div><p className="muted" style={{ fontSize: 14 }}>Claude construit une grille à partir des référentiels sectoriels reconnus. Relisez-la avant usage.</p>
    <div className="grid" style={{ gap: 12 }}><div className="field"><label>Type d'audit</label><input className="input" value={label} onChange={e => setLabel(e.target.value)} placeholder="Ex. Audit de visite magasin, Audit conformité REACH" /></div>
      <div className="field"><label>Secteur</label><input className="input" value={sector} onChange={e => setSector(e.target.value)} placeholder="Ex. Distribution, Chimie" /></div>
      {err && <div style={{ fontSize: 13, color: "var(--bp-red)" }}>{err}</div>}
      <div className="row" style={{ justifyContent: "flex-end" }}><button className="btn" onClick={onClose}>Annuler</button><button className="btn btn-dark" disabled={!label || busy} onClick={gen}>{busy ? <><span className="spinner" />Génération…</> : "Générer la grille"}</button></div></div></Modal>;
}

function Consent({ v, onBack, onOk }) {

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function extractDocText(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith(".pdf")) {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const out = [];
    for (let i = 1; i <= pdf.numPages; i++) { const c = await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(x => x.str).join(" ")); }
    return out.join("\n");
  }
  if (n.endsWith(".docx")) {
    const z = await JSZip.loadAsync(file); const xml = await z.file("word/document.xml").async("string");
    return xml.replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'");
  }
  return await file.text();
}
const splitSentences = (text) => text.split(/(?<=[.!?;])\s+|\n+/).map(s => s.replace(/\s+/g, " ").trim()).filter(s => s.length > 2);

function useWide(px) { const [w, setW] = useState(innerWidth >= px); useEffect(() => { const f = () => setW(innerWidth >= px); addEventListener("resize", f); return () => removeEventListener("resize", f); }, []); return w; }

function PlanImageView({ plan, sections, secName = (s) => s.fr, cur, onSeek, editable, selected, onSelect, onPlace, onRename }) {

function PlanView({ v, cur, range, onSeek }) {
  const W = 600, H = 420, pad = 40; const tr = v.trace;
  const bb = tr.length ? tr.reduce((b, p) => ({ a: Math.min(b.a, p.lat), b: Math.max(b.b, p.lat), c: Math.min(b.c, p.lng), d: Math.max(b.d, p.lng) }), { a: 90, b: -90, c: 180, d: -180 }) : null;

  const at = pts.reduce((b, p) => p[2] <= cur ? p : b, pts[0]);
  const photoPt = (p) => { const n = pts.reduce((b, q) => Math.abs(q[2] - p.t) < Math.abs(b[2] - p.t) ? q : b, pts[0]); return n; };
  return <div className="card" style={{ overflow: "hidden" }}>
    <div className="row between" style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}><span className="eyebrow">Plan et parcours</span><span className="mono faint" style={{ fontSize: 11 }}>{tr.length} points GPS</span></div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block", background: "var(--surface-2)" }}>
      <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--border-soft)" /></pattern></defs>
      <rect width={W} height={H} fill="url(#g)" />
      <g fill="none" stroke="var(--border)" strokeWidth="1.5"><rect x="30" y="30" width="540" height="360" /><path d="M30 170H250V30M250 250H570M400 250V390M150 170V390" /></g>
      <g fill="var(--text-3)" style={{ fontSize: 10, fontFamily: "var(--font-mono)" }}><text x="40" y="48">RÉCEPTION</text><text x="262" y="48">PRODUCTION</text><text x="40" y="188">STOCK</text><text x="262" y="268">CONTRÔLE</text><text x="412" y="268">EXPÉDITION</text></g>
      {pts.length > 1 && <polyline points={pts.map(p => p[0] + "," + p[1]).join(" ")} fill="none" stroke="var(--text)" strokeWidth="2" opacity=".5" />}
      {pts.length > 1 && <polyline points={pts.filter(p => p[2] >= range[0] && p[2] <= range[1]).map(p => p[0] + "," + p[1]).join(" ")} fill="none" stroke="var(--bp-red)" strokeWidth="3" />}
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="9" fill="transparent" style={{ cursor: "pointer" }} onClick={() => onSeek(p[2])} />)}
      {pts.length > 0 && v.photos.map(p => { const q = photoPt(p); return q && <g key={p.id} onClick={() => onSeek(p.t)} style={{ cursor: "pointer" }}><rect x={q[0] - 7} y={q[1] - 7} width="14" height="14" fill="var(--bg)" stroke="var(--text)" /><circle cx={q[0]} cy={q[1]} r="2.5" fill="var(--text)" /></g>; })}
      {at && <circle cx={at[0]} cy={at[1]} r="8" fill="var(--bp-red)" stroke="#fff" strokeWidth="2" />}
      {!pts.length && <text x={W / 2} y={H / 2} textAnchor="middle" fill="var(--text-3)" style={{ fontSize: 13 }}>Activez le GPS pendant la visite pour tracer le parcours</text>}
    </svg>
    <div className="faint" style={{ fontSize: 12, padding: "8px 16px" }}>Plan schématique de démonstration. Touchez le tracé pour aller à ce moment de l'audio.</div>
  </div>;
}

  useEffect(() => { (async () => {
    const [a, v, p, types] = await Promise.all([storage.get("audits"), storage.get("visits"), storage.get("practices"), storage.get("types")]);
    if (types) Object.assign(AUDIT_TYPES, types);
    setAudits(a ? (a.some(x => x.id === "a42") ? a.map(x => x.id === "a42" && (!x.plan || String(x.plan.src).startsWith("/demo/")) ? { ...AUDIT_42(), findings: x.findings, status: x.status } : x) : [AUDIT_42(), ...a]) : SEED_AUDITS()); setVisits(v || []); if (p) setPractices(p);
  })(); }, []);
  useEffect(() => { if (audits) storage.set("audits", audits); }, [audits]);
  useEffect(() => { storage.set("visits", visits); }, [visits]);
  useEffect(() => { storage.set("practices", practices); }, [practices]);
  useEffect(() => { ls.set("insp.cmp", compare); }, [compare]);
  const toast = useCallback((m) => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(null), 2600); }, []);
  const store = {
    user, theme, audits: audits || [], visits, practices, compare, toast,
    toggleTheme: () => setTheme(t => t === "night" ? "day" : "night"),
    logout: () => { ls.set("insp.role", null); setUser(null); go("/"); },
    visible: (a) => !user || user.role === "consultant" || ((a.org === CLIENT_ORG || a.source !== "mine") && a.status !== "À valider"),
    updateAudit: (id, fn) => setAudits(l => l.map(a => a.id === id ? fn(a) : a)),
    upsertAudit: (a) => setAudits(l => [a, ...l.filter(x => x.id !== a.id)]),
    addVisit: (v) => setVisits(l => [v, ...l]),
    removeVisit: (id) => setVisits(l => l.filter(v => v.id !== id)),
    updateVisit: (id, fn) => setVisits(l => l.map(v => v.id === id ? fn(v) : v)),
    addPractice: (p) => setPractices(l => [{ id: uid(), ...p }, ...l]),
    addType: (k, t) => { AUDIT_TYPES[k] = t; storage.get("types").then(x => storage.set("types", { ...(x || {}), [k]: t })); force(n => n + 1); },
    toggleCompare: (id) => setCompare(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id].slice(-4)), setCompare,
    reset: async () => { await storage.clear(); location.reload(); },
  };
  const [path, query] = route.split("?");
  let body;
  if (!audits) body = <div style={{ display: "grid", placeItems: "center", height: "100%" }}><span className="spinner" /></div>;
  else if (path.startsWith("/supplier/")) body = <SupplierPortal id={path.split("/")[2]} />;
  else if (!user) body = <Login onLogin={(r) => { ls.set("insp.role", r); setUser(USERS[r]); }} />;
  else {
    let page;
    if (path.startsWith("/audit/")) page = <AuditReport id={path.split("/")[2]} go={go} key={path} />;
    else if (path.startsWith("/visit") && user.role === "consultant") page = <VisitApp query={query || ""} go={go} />;
    else if (path.startsWith("/compare")) page = <Compare go={go} />;
    else if (path.startsWith("/practices")) page = <Practices />;
    else if (path.startsWith("/actions")) page = <ActionsPage go={go} />;
    else page = <Library go={go} />;
    body = <Shell route={path} go={go}>{page}</Shell>;
  }
  return <Store.Provider value={store}>{body}{toastMsg && <div className="toast">{toastMsg}</div>}</Store.Provider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
